# 섞인 질문(사실 + 판단·범위 밖)에서 답하지 않은 부분에 붙이는 거절 문장.
# 계획 JSON의 refuse 값(docs/interface.md)이 키다. 사실 부분 답 뒤, 고지 앞에 코드가 붙인다.
