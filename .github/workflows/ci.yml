name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    # 테스트용 DB. 값은 CI 안에서만 쓰는 임시 값이며 시크릿이 아니다.
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: etf
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: etf_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etf -d etf_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # conftest가 DB 이름 뒤에 _test를 붙인 별도 DB를 만들어 쓴다.
      TEST_DATABASE_URL: postgresql+asyncpg://etf:ci-only@localhost:5432/etf_agent
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
    steps:
      - name: Guard - main으로는 dev에서만 PR 가능
        if: >-
          github.event_name == 'pull_request' &&
          github.base_ref == 'main' &&
          (github.head_ref != 'dev' ||
           github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "::error::main으로는 dev에서만 PR 가능"
          exit 1

      - uses: actions/checkout@v4

      # ---------- API (Python 3.14 + uv) ----------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --locked

      - name: Lint (ruff check)
        working-directory: apps/api
        run: uv run ruff check --config pyproject.toml . ../../jobs ../../ml ../../scripts

      - name: Format check (ruff format)
        working-directory: apps/api
        run: uv run ruff format --check --config pyproject.toml . ../../jobs ../../ml ../../scripts

      - name: Test (pytest, fake 공급자)
        working-directory: apps/api
        run: uv run pytest

      # ---------- Web (Node 24) ----------
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Web lint
        working-directory: apps/web
        run: npm run lint

      - name: Web format check
        working-directory: apps/web
        run: npm run format:check

      - name: Web typecheck
        working-directory: apps/web
        run: npm run typecheck
