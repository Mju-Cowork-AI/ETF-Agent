# 마이그레이션 → 샘플 시드 → 실데이터 적재(샘플 ETF·시세·공시 삭제) → 문서 적재(샘플 문서 삭제 후 data/docs 적재) 작업 정의 예시(비밀 값 없음). infra/azure/README.md 참고
# 만들기: az containerapp job create -g rg-etf-agent -n caj-etf-agent-setup --yaml <이 파일을 채운 사본>
# 실행:   az containerapp job start -g rg-etf-agent -n caj-etf-agent-setup
location: koreacentral
identity:
  type: UserAssigned
  userAssignedIdentities:
    "/subscriptions/<구독 ID>/resourcegroups/rg-etf-agent/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-etf-agent-api": {}
properties:
  environmentId: "/subscriptions/<구독 ID>/resourceGroups/rg-etf-agent/providers/Microsoft.App/managedEnvironments/cae-etf-agent"
  configuration:
    triggerType: Manual
    replicaTimeout: 900
    replicaRetryLimit: 0
    manualTriggerConfig:
      parallelism: 1
      replicaCompletionCount: 1
    registries:
      - server: acretfagentb084.azurecr.io
        identity: "/subscriptions/<구독 ID>/resourcegroups/rg-etf-agent/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-etf-agent-api"
    secrets:
      - name: database-url
        keyVaultUrl: https://kv-etf-agent-b084.vault.azure.net/secrets/DATABASE-URL
        identity: "/subscriptions/<구독 ID>/resourcegroups/rg-etf-agent/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-etf-agent-api"
      - name: llm-api-key
        keyVaultUrl: https://kv-etf-agent-b084.vault.azure.net/secrets/LLM-API-KEY
        identity: "/subscriptions/<구독 ID>/resourcegroups/rg-etf-agent/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-etf-agent-api"
      - name: local-jwt-secret
        keyVaultUrl: https://kv-etf-agent-b084.vault.azure.net/secrets/LOCAL-JWT-SECRET
        identity: "/subscriptions/<구독 ID>/resourcegroups/rg-etf-agent/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-etf-agent-api"
  template:
    containers:
      - name: setup
        image: acretfagentb084.azurecr.io/etf-agent-api:<태그>
        command: ["/bin/sh", "-c"]
        args: ["alembic upgrade head && python -m jobs.seed && python -m jobs.load_real && python -m jobs.ingest /workspace/data/docs --delete-prefix data/samples/docs"]
        resources: {cpu: 0.5, memory: 1Gi}
        env:
          - {name: APP_ENV, value: prod}
          - {name: AUTH_PROVIDER, value: local}
          - {name: DATABASE_URL, secretRef: database-url}
          - {name: LOCAL_JWT_SECRET, secretRef: local-jwt-secret}
          - {name: LLM_PROVIDER, value: openai_compat}
          - {name: LLM_BASE_URL, value: "https://etf-agent-local-22eaff.openai.azure.com/openai/v1/"}
          - {name: LLM_API_KEY, secretRef: llm-api-key}
          - {name: LLM_MODEL, value: gpt-6-sol}
          - {name: JUDGE_MODEL, value: gpt-6-luna}
          - {name: EMBEDDING_MODEL, value: text-embedding-3-small}
          - {name: EMBEDDING_DIM, value: "1024"}
          - {name: EMBEDDING_REQUEST_DIMENSIONS, value: "true"}
          - {name: STORAGE_LOCAL_DIR, value: /data/storage}
